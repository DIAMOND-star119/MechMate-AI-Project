# Netlify deploy. App lives in apps/web as a standalone install (no npm
# workspaces hoisting — hoisted Next.js breaks the Next Runtime bundling).
# In the Netlify UI set: Base directory = (unset), Package directory = apps/web,
# Build command = npm run build, Publish directory = apps/web/.next.
[build]
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"

# Next.js App Router pages + API routes deploy as Netlify Functions
# automatically via the framework integration. No functions directory needed.
